$('fsv').onclick=async()=>{try{$('fst').textContent='Making video…';fdraw();const b=await cardMP4($('fcv'),6),f=new File([b],'faith.mp4',{type:'video/mp4'});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='faith.mp4';a.click()}$('fst').textContent='Done.'}catch(e){$('fst').textContent=e&&e.name=='AbortError'?'':(e&&e.message)||'Failed'}};
$('fpost').onclick=async()=>{try{fdraw();$('fst').textContent='Making video…';const b=await cardMP4($('fcv'),6);await send('faith',b,$('fcap').value,'',$('fst'))}catch(e){$('fst').textContent=(e&&e.message)||'Failed'}};
})();
</script>
